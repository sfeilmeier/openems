counter24hWarning = Batteriefehler 2 mal aufgetreten innerhalb von 24h
counter24hFault = Batterie-Abschaltung: 24h-Fehlerschwelle überschritten
counterLongTimeWarning = Häufige Batteriefehler über längeren Zeitraum erkannt (>5 mal)
counterLongTimeFault = System gesperrt: Batterie-Fehlerschwelle überschritten (10 mal)