name: "Download a build artifact"
description: "Download a build artifact to the cache"
inputs:
  user:
    description: "The user name to use for the download"
    required: true
  password:
    description: "The password to use for the download"
    required: true
  name:
    description: "The cache keys to use. Separated by newlines or commas"
    required: true
  target:
    description: "The path to download the artifact to"
    required: false
    default: "./"
  recursive:
    description: "Whether to download directories recursively (true|false)"
    required: false
    default: "true"
  fail-on-missing:
    description: "Whether to fail the action if an artifact is missing (true|false)"
    required: false
    default: "true"
  verbose:
    description: "Whether to enable verbose output (true|false)"
    required: false
    default: "false"
  options:
    description: "Additional options to pass to the upload command"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Download build artifact
      shell: bash
      run: |
        opts=""
        if [[ "${{ inputs.recursive }}" == "true" ]]; then opts="--recursive"; fi
        # Split names by newline to support multiple names
        names=$(echo "${{ inputs.name }}" | tr ',' '\n')
        /tools/mc alias set local http://gitea-runner-cache:9000 ${{ inputs.user }} ${{ inputs.password }}
        for name in $names; do
          reference=fems-${{ github.run_id }}_$name
          
          # Check if the artifact exists before trying to download
          if /tools/mc stat local/cache-fems/$reference > /dev/null 2>&1; then
            echo "mc cp $opts local/cache-fems/$reference/ "${{ inputs.target }}""
            if [[ "${{ inputs.verbose }}" == "true" ]]; then
              /tools/mc cp $opts local/cache-fems/$reference/ "${{ inputs.target }}"
            else
              /tools/mc cp $opts local/cache-fems/$reference/ "${{ inputs.target }}" > /dev/null
            fi
          else
            if [[ "${{ inputs.fail-on-missing }}" == "true" ]]; then
              echo "Error: Artifact $reference not found!"
              exit 1
            elif [[ "${{ inputs.verbose }}" == "true" ]]; then
              echo "Warning: Artifact $reference not found, skipping..."
            fi
          fi
        done
