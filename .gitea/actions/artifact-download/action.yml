name: "Download a build artifact"
description: "Download a build artifact to the cache"
inputs:
  user:
    description: "The user name to use for the download"
    required: true
  password:
    description: "The password to use for the download"
    required: true
  name:
    description: "The cache key to use"
    required: true
  target:
    description: "The path to download the artifact to"
    required: false
    default: "./"
  recursive:
    description: "Whether to download directories recursively (true|false)"
    required: false
    default: "true"
  verbose:
    description: "Whether to enable verbose output (true|false)"
    required: false
    default: "false"
  options:
    description: "Additional options to pass to the upload command"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Download build artifact
      shell: bash
      run: |
        reference=fems-${{ github.sha }}_${{ inputs.name }}
        opts=""
        if [[ "${{ inputs.recursive }}" == "true" ]]; then opts="--recursive"; fi
        
        /tools/mc alias set local http://gitea-runner-cache:9000 ${{ inputs.user }} ${{ inputs.password }}
        echo "mc cp $opts local/cache-fems/$reference ${{ inputs.source }} ${{ inputs.options }}"
        if [[ "${{ inputs.verbose }}" == "true" ]]; then
          /tools/mc cp $opts local/cache-fems/$reference/ "${{ inputs.target }}"
        else
          /tools/mc cp $opts local/cache-fems/$reference/ "${{ inputs.target }}" > /dev/null
        fi
