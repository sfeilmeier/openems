name: Debian build
run-name: Build Debian-Package for FEMS
on:
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

env:
  CI_COMMIT_BRANCH: ${{ gitea.head_ref || gitea.ref_name }}

jobs:
  build-debian:
    runs-on: ubuntu-latest
    env:
      OPENEMS_ENV: "${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/openems.env" 
      EDGE_JAR: "${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/edge.jar"
      UI_BUNDLE: "${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/fems-ui-edge.tar.gz"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            tools/
            .gitea/

      - name: Setup SSH
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          host-key: ${{ secrets.DEV_SERVER_HOST_KEY }}
          host: ${{ vars.DEV_SERVER_HOST }}

      - name: Check Artifacts
        run: |
          export EDGE_EXISTS=$(ssh ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }} "test -e ${{ env.EDGE_JAR }} && echo true || echo false")
          export UI_EXISTS=$(ssh ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }} "test -e ${{ env.UI_BUNDLE }} && echo true || echo false")

          echo "Edge JAR exists: $EDGE_EXISTS"
          echo "UI Bundle exists: $UI_EXISTS"

          if [[ "$EDGE_EXISTS" == "false" && "$UI_EXISTS" == "false" ]]; then
            echo "No artifacts found for branch '${CI_COMMIT_BRANCH}'! Aborting build."
            exit 1
          fi

      - name: Prepare Environment
        run: |
          # Get environment
          rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ env.OPENEMS_ENV }} ./openems.env
          mkdir -p /build/target/

      - name: Download UI
        env:
          UI_DESTINATION: "tools/debian/usr/share/openems-fems/www/"
        run: |
          export ARTIFACT_EXISTS=$(ssh ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }} "test -e ${{ env.UI_BUNDLE }} && echo true || echo false")

          if [[ "$ARTIFACT_EXISTS" == "true" ]]; then
            echo "Get UI artifact ${{ env.UI_BUNDLE }}"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ env.UI_BUNDLE }} ./fems-ui-edge.tar.gz
          else
            echo "UI artifacts not found! Use 'develop' instead"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/develop/fems-ui-edge.tar.gz ./fems-ui-edge.tar.gz
          fi
          mkdir -p $UI_DESTINATION
          tar -xvzf fems-ui-edge.tar.gz -C $UI_DESTINATION > /dev/null
          count=$(find "$UI_DESTINATION" -type f | wc -l)
          echo "Extracted $count files to $UI_DESTINATION"

      - name: Download Edge
        env:
          EDGE_DESTINATION: "tools/debian/usr/lib/openems/"
        run: |
          export ARTIFACT_EXISTS=$(ssh ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }} "test -e ${{ env.EDGE_JAR }} && echo true || echo false")

          if [[ "$ARTIFACT_EXISTS" == "true" ]]; then
            echo "Get Edge JAR ${{ env.EDGE_JAR }}"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ env.EDGE_JAR }} ./edge.jar
          else
            echo "Edge JAR not found! Use 'develop' instead"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/develop/edge.jar ./edge.jar
          fi
          mkdir -p $EDGE_DESTINATION
          mv -v edge.jar $EDGE_DESTINATION/openems.jar

      - name: Build Debian Package
        run: |
          source tools/common.sh
          source openems.env
          export SKIP_DEB_INITIALIZE=true
          bash -x tools/build-debian-package.sh /build/target/
          ls -l /build/target/

      - name: Upload Debian Package
        run: |
          echo "Upload to ${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/"
          rsync --mkpath /build/target/fems.deb ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/fems.deb
          rsync --mkpath /build/target/fems.version ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/fems.version