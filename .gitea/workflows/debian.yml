name: Debian build
run-name: Build Debian-Package for FEMS
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_COMMIT_BRANCH: ${{ github.ref_name }}

jobs:
  build-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: "tools/\n.gitea/"

      - name: Setup SSH
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ vars.DEV_SERVER_HOST }}

      - name: Prepare Environment
        run: |
          export OPENEMS_ENV="${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/openems.env"
          # Get environment
          rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${OPENEMS_ENV} ./openems.env
          mkdir -p /build/target/

      - name: Download UI
        run: |
          export UI_BUNDLE="${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/fems-ui.tar.gz"
          export ARTIFACT_EXISTS=$(ssh ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }} "test -e ${UI_BUNDLE} && echo true || echo false")
          export UI_DESTINATION="tools/debian/usr/share/openems-fems/www/"

          if [[ "$ARTIFACT_EXISTS" == "true" ]]; then
            echo "Get UI artifact ${UI_BUNDLE}"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${UI_BUNDLE} ./fems-ui.tar.gz
          else
            echo "UI artifacts not found! Use 'develop' instead"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/develop/fems-ui.tar.gz ./fems-ui.tar.gz
          fi
          mkdir -p ${UI_DESTINATION}
          tar -xvzf fems-ui.tar.gz -C ${UI_DESTINATION} > /dev/null
          count=$(find "${UI_DESTINATION}" -type f | wc -l)
          echo "Extracted $count files to ${UI_DESTINATION}"

      - name: Download Edge
        run: |
          export EDGE_JAR="${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/edge.jar"
          export ARTIFACT_EXISTS=$(ssh ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }} "test -e ${EDGE_JAR} && echo true || echo false")
          export EDGE_DESTINATION="tools/debian/usr/lib/openems/"

          if [[ "$ARTIFACT_EXISTS" == "true" ]]; then
            echo "Get Edge JAR ${EDGE_JAR}"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${EDGE_JAR} ./edge.jar
          else
            echo "Edge JAR not found! Use 'develop' instead"
            rsync ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/develop/edge.jar ./edge.jar
          fi
          mkdir -p ${EDGE_DESTINATION}
          mv -v edge.jar ${EDGE_DESTINATION}/openems.jar

      - name: Build Debian Package
        run: |
          source tools/common.sh
          source openems.env
          export SKIP_DEB_INITIALIZE=true
          bash -x tools/build-debian-package.sh /build/target/
          ls -l /build/target/

      - name: Upload Debian Package
        run: |
          echo "Upload to ${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/"
          rsync --mkpath /build/target/fems.deb ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/fems.deb
          rsync --mkpath /build/target/fems.version ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/fems.version