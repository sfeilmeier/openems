name: App-Build
run-name: App Build for FEMS
on:
  workflow_dispatch:
  push:
    branches: [main, develop, main-ui]

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

env:
  CI_COMMIT_BRANCH: ${{ gitea.ref_name }}
  CI_GROUP: ${{ gitea.workflow }}-${{ gitea.ref_name }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Environment
        id: env
        run: |
          echo "CI_GROUP=${CI_GROUP}"
          mkdir /env
          source tools/common.sh
          common_initialize_environment
          common_build_snapshot_version
          common_save_environment /env/openems.env
          common_create_version_file /env/fems.version

      - name: Upload artifact
        uses: ./.gitea/actions/artifact-upload
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          source: /env/
          verbose: "true"

  build-android-app:
    runs-on: ubuntu-latest-android
    needs: setup
    strategy:
      fail-fast: true
      matrix:
        theme: [fenecon, heckert]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            tools/
            ui/
            gradle/
            .gitea/

      - name: Download artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          verbose: "true"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build android app
        run: |
          export THEME=${{ matrix.theme }}
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_build_android_app

      - name: Upload artifact
        uses: ./.gitea/actions/artifact-upload
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: ui
          source: ui/android/target/

  build-ios-app:
    if: gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/main-ui'
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: true
      matrix:
        theme: [fenecon]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            tools/
            ui/
            gradle/
            .gitea/

      - name: Download artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          verbose: "true"

      - name: Setup SSH
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.MAC_SSH_KEY }}
          host-key: ${{ secrets.MAC_HOST_KEY }}
          host: ${{ vars.MAC_HOST }}

      - name: Build and release iOS app
        env:
          MAC_HOST: ${{ vars.MAC_HOST }}
          MAC_USER: fems
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          /usr/bin/ssh -o StrictHostKeyChecking=no ${MAC_USER}@${MAC_HOST} /Users/fems/process_ios_app.sh ${{ matrix.theme }} Release ${{ gitea.ref_name }}

  upload:
    runs-on: ubuntu-latest
    needs: [build-android-app]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: ".gitea/"

      - name: Download UI artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: ui
          target: /artifacts/

      - name: Setup SSH
        run: |
          apt-get update
          apt-get install -y rsync ssh
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.DEV_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Check artifacts
        run: ls -lR /artifacts/

      - name: Update App
        run: |
          echo "Deploying to ${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/"
          rsync --mkpath /artifacts/* ${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}:${{ vars.DEV_SERVER_DIR }}/${CI_COMMIT_BRANCH}/

  release-android-app:
    runs-on: ubuntu-latest-android
    if: gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/main-ui'
    needs: [upload]
    strategy:
      fail-fast: true
      matrix:
        theme: [fenecon, heckert]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            tools/
            .gitea/
            ui/

      - name: Download artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          verbose: "true"

      - name: Create Android Release
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          echo -n "${{ secrets.DEVELOPER_API_SERVICE_ACCOUNT }}" | base64 -d > secret.json
          python3 tools/deploy/android/create_release.py "${{ matrix.theme }}" "$VERSION_FULL" secret.json ${CI_COMMIT_BRANCH}

  release-ios-app:
    if: gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/main-ui'
    runs-on: ubuntu-latest-ios
    needs: [build-ios-app]
    strategy:
      fail-fast: true
      matrix:
        theme: [fenecon]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            tools/
            ui/
            .gitea/

      - name: Create Ios Release
        env:
          AUTHENTICATION_KEY_ID: ${{ vars.IOS_AUTH_KEY_ID }}
          AUTHENTICATION_KEY_ISSUER_ID: ${{ vars.IOS_AUTH_KEY_ISSUER_ID }}
          AUTHENTICATION_KEY_PATH: ${{ vars.IOS_AUTH_KEY_PATH }}
        run: |
          source tools/common.sh
          common_initialize_environment
          echo -n "${{ secrets.IOS_AUTH_KEY }}" | base64 -d > secret.p8
          create_ios_app_release -t "${{ matrix.theme }}" -a secret.p8

  cleanup:
    runs-on: ubuntu-latest
    needs:
      [
        build-android-app,
        upload,
        release-android-app,
        build-ios-app,
        release-ios-app,
      ]
    if: always()
    continue-on-error: true
    steps:
      - name: checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .gitea/

      - name: Clear build cache
        uses: ./.gitea/actions/artifact-clear
        continue-on-error: true
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: |
            environment
            ui
