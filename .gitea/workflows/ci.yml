name: CI-Build
run-name: CI Build for FEMS
on:
  workflow_dispatch:
  pull_request:

# https://docs.gitea.com/next/usage/actions/comparison#concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dmaven.repo.local=/cache/maven
  CI_COMMIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  CI_GROUP: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow environment
        run: |
          echo "Event Name: ${{ gitea.event_name }}"
          if ! [ "${{ gitea.event_name }}" = "pull_request" ]; then
            echo "Not a pull request event."
            exit 0
          fi

          LABELS_JSON='${{ toJson(gitea.event.pull_request.labels) }}'
          echo "Labels: ${LABELS_JSON}"
          if echo "${LABELS_JSON}" | jq -r '.[].name' | grep -Eq '^(Edge|Backend|UI)$'; then
            echo "Valid label found; proceeding."
          else
            echo "No valid labels found in PR! At least one of 'Edge', 'Backend' or 'UI' label is required."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            tools/
            .gitea/
            io.openems.common/src/io/openems/common/OpenemsConstants.java
            ui/package.json
            ui/package-lock.json
            ui/src/app/changelog/view/component/changelog.constants.ts

      - name: Environment
        id: env
        run: |
          echo "CI_GROUP=${CI_GROUP}"
          mkdir /env
          source tools/common.sh
          common_initialize_environment
          common_build_snapshot_version
          common_save_environment /env/openems.env
          common_create_version_file /env/fems.version

      - name: Upload artifact
        uses: ./.gitea/actions/artifact-upload
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          source: /env/
          verbose: "true"

  build-edge:
    runs-on: ubuntu-latest
    needs: setup
    if: |
      contains(join(fromJson(toJson(gitea.event.pull_request.labels)).*.name), 'Edge') || (gitea.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          verbose: "true"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-edge-cache_gradle
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Gradle Wrapper
        run: |
          ./gradlew wrapper

      - name: Checkstyle
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_checkstyle_edge --console=plain --warn --parallel --max-workers=4

      - name: Test
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_test_edge --console=plain --warn --parallel --max-workers=4

      - name: Build Jar
        env:
          OEMS_EDGE_OUTPUT: "build/target/edge.jar"
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_update_version_in_code
          echo "Build Version $VERSION"
          common_build_edge --console=plain --warn --parallel --max-workers=2
          common_check_file "$OEMS_EDGE_OUTPUT" "OpenEMS Edge JAR missing!"

      - name: Upload artifact
        uses: ./.gitea/actions/artifact-upload
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: jars
          source: build/target/

      - name: Sonarqube Scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_EDGE }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_EDGE }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          ./gradlew jacocoEdgeReport sonar \
            -Psonar.scope=edge \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName='OpenEMS Edge' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ gitea.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ gitea.event.pull_request.head.ref }} \
            -Dsonar.pullrequest.base=${{ gitea.event.pull_request.base.ref }}

  build-backend:
    runs-on: ubuntu-latest
    needs: setup
    if: |
      contains(join(fromJson(toJson(gitea.event.pull_request.labels)).*.name), 'Backend') || (gitea.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          verbose: "true"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: gradle

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-backend-cache_gradle
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Gradle Wrapper
        run: |
          ./gradlew wrapper

      - name: Checkstyle
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_checkstyle_backend --console=plain --warn --parallel --max-workers=4

      - name: Test
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_test_backend --console=plain --warn --parallel --max-workers=4

      - name: Build Jar
        env:
          OEMS_BACKEND_OUTPUT: "build/target/backend.jar"
        run: |
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_update_version_in_code
          echo "Build Version $VERSION"
          common_build_backend --console=plain --warn --parallel --max-workers=2
          common_check_file "$OEMS_BACKEND_OUTPUT" "OpenEMS Backend JAR missing!"

      - name: Upload artifact
        uses: ./.gitea/actions/artifact-upload
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: jars
          source: build/target/

      - name: Sonarqube Scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_BACKEND }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_BACKEND }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          ./gradlew jacocoBackendReport sonar \
            -Psonar.scope=backend \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName='OpenEMS Backend' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }} \
            -Dsonar.pullrequest.key=${{ gitea.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ gitea.event.pull_request.head.ref }} \
            -Dsonar.pullrequest.base=${{ gitea.event.pull_request.base.ref }}

  build-ui:
    runs-on: ubuntu-latest-ui
    needs: setup
    if: |
      contains(join(fromJson(toJson(gitea.event.pull_request.labels)).*.name), 'UI') || (gitea.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools/
            ui/
            .gitea/

      - name: Download artifact
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: environment
          verbose: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: npm install
        run: |
          cd ui
          if [ -n "${{ vars.NPM_REGISTRY }}" ]; then 
            npm set registry "${{ vars.NPM_REGISTRY }}"; 
          fi
          npm ci --prefer-offline --force

      - name: Test UI
        run: |
          export OEM=$(case ${CI_COMMIT_BRANCH^^} in *HECKERT*) echo "heckert";; *) echo "fenecon";; esac)
          echo "Testing UI for $OEM"
          cd ui
          npm run lint
          node_modules/.bin/tsc
          node_modules/.bin/tsc-strict
          node_modules/.bin/ng build --base-href /${CI_COMMIT_BRANCH}/ -c "$OEM,$OEM-backend-docker"
          npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
          echo "Bundle fems-ui-backend.tar.gz"
          tar -C target/ -czf fems-ui-backend.tar.gz .
          rm -r target/

      - name: Build UI
        run: |
          export OEM=$(case ${CI_COMMIT_BRANCH^^} in *HECKERT*) echo "heckert";; *) echo "fenecon";; esac)
          source tools/common.sh
          common_initialize_environment
          source openems.env
          common_update_version_in_code
          echo "Build for $OEM"
          cd ui
          node_modules/.bin/ng build -c "$OEM,$OEM-edge-prod,prod"
          echo "Bundle fems-ui-edge.tar.gz"
          tar -C target/ -czf fems-ui-edge.tar.gz .

      - name: Upload artifact
        uses: ./.gitea/actions/artifact-upload
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: ui
          source: |
            ui/fems-ui-edge.tar.gz
            ui/fems-ui-backend.tar.gz

      - name: Sonarqube Scan
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_UI }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_UI }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName='OpenEMS UI' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }} \
            -Dsonar.sources=ui/src \
            -Dsonar.tests=ui/src \
            -Dsonar.test.inclusions=**/*.spec.ts \
            -Dsonar.typescript.lcov.reportPaths=ui/coverage/ngv/lcov.info \
            -Dsonar.pullrequest.key=${{ gitea.event.pull_request.number }} \
            -Dsonar.pullrequest.branch=${{ gitea.event.pull_request.head.ref }} \
            -Dsonar.pullrequest.base=${{ gitea.event.pull_request.base.ref }}

  upload:
    runs-on: ubuntu-latest
    needs: [build-edge, build-backend, build-ui]
    if: |
      always() &&   
      (needs.build-edge.result == 'skipped' || needs.build-edge.result == 'success') &&
      (needs.build-backend.result == 'skipped' || needs.build-backend.result == 'success') &&
      (needs.build-ui.result == 'skipped' || needs.build-ui.result == 'success')
    env:
      DEPLOY_HOST: "${{ vars.DEV_SERVER_USER }}@${{ vars.DEV_SERVER_HOST }}"
      DEPLOY_DIR: "${{ vars.DEV_SERVER_DIR }}/${{ env.CI_COMMIT_BRANCH }}"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: ".gitea/"

      - name: Download environment
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: |
            environment
          target: /artifacts/

      - name: Download artifacts
        uses: ./.gitea/actions/artifact-download
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          verbose: "true"
          fail-on-missing: "false"
          name: |
            jars
            ui
          target: /artifacts/

      - name: Check artifacts
        run: ls -lR /artifacts/

      - name: Setup SSH
        uses: ./.gitea/actions/setup-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          host: ${{ vars.DEV_SERVER_HOST }}

      - name: Update Edge
        run: |
          if [ -f /artifacts/edge.jar ]; then
            echo "Deploying to ${{ env.DEPLOY_DIR }}/edge.jar"
            rsync --mkpath /artifacts/edge.jar ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/edge.jar
          else
            echo "Delete from ${{ env.DEPLOY_DIR }}/edge.jar"
            ssh ${{ env.DEPLOY_HOST }} "rm ${{ env.DEPLOY_DIR }}/edge.jar || true"
          fi

      - name: Update Backend
        run: |
          if [ -f /artifacts/backend.jar ]; then
            echo "Deploying to ${{ env.DEPLOY_DIR }}/backend.jar"
            rsync --mkpath /artifacts/backend.jar ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/backend.jar
          else
            echo "Delete from ${{ env.DEPLOY_DIR }}/backend.jar"
            ssh ${{ env.DEPLOY_HOST }} "rm ${{ env.DEPLOY_DIR }}/backend.jar || true"
          fi

      - name: Update UI
        run: |
          if [ -f /artifacts/fems-ui-edge.tar.gz ] && [ -f /artifacts/fems-ui-backend.tar.gz ]; then
            echo "Deploying to ${{ env.DEPLOY_DIR }}/fems-ui-edge.tar.gz"
            echo "Deploying to ${{ env.DEPLOY_DIR }}/fems-ui-backend.tar.gz"
            rsync --mkpath /artifacts/fems-ui-edge.tar.gz ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/fems-ui-edge.tar.gz
            rsync --mkpath /artifacts/fems-ui-backend.tar.gz ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/fems-ui-backend.tar.gz
            ssh ${{ env.DEPLOY_HOST }} "/opt/gitea/develop/fems-ui/update-nginx.sh ${{ env.CI_COMMIT_BRANCH }}"
          else
            echo "Delete from ${{ env.DEPLOY_DIR }}/fems-ui-edge.tar.gz"
            echo "Delete from ${{ env.DEPLOY_DIR }}/fems-ui-backend.tar.gz"
            ssh ${{ env.DEPLOY_HOST }} "rm ${{ env.DEPLOY_DIR }}/fems-ui-*.tar.gz || true"
            ssh ${{ env.DEPLOY_HOST }} "/opt/gitea/develop/fems-ui/update-nginx.sh ${{ env.CI_COMMIT_BRANCH }} --cleanup || true"
          fi

      - name: Update Environment
        run: |
          echo "Deploying to ${{ env.DEPLOY_DIR }}/openems.env"
          rsync --mkpath /artifacts/openems.env ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_DIR }}/openems.env

  comment-scan-results:
    runs-on: ubuntu-latest
    needs: [build-edge, build-backend, build-ui]
    if: |
      always() && gitea.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Checkout actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .gitea/

      - name: Query SonarQube results
        id: sonarqube
        uses: ./.gitea/actions/sonarqube-qg-query
        with:
          sonar_host_url: ${{ vars.SONARQUBE_HOST_URL }}
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          project_keys: >
            ${{ vars.SONARQUBE_PROJECT_KEY_EDGE }},
            ${{ vars.SONARQUBE_PROJECT_KEY_BACKEND }},
            ${{ vars.SONARQUBE_PROJECT_KEY_UI }}

      - name: Update PR comment with SonarQube results
        uses: ./.gitea/actions/gitea-pr-comment
        with:
          gitea_token: ${{ secrets.COMMENT_TOKEN }}
          pr_number: ${{ gitea.event.pull_request.number }}
          body: ${{ steps.sonarqube.outputs.comment_body }}


  cleanup:
    runs-on: ubuntu-latest
    needs: [build-backend, build-edge, build-ui, upload]
    if: always()
    continue-on-error: true
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: .gitea/

      - name: Clear build cache
        uses: ./.gitea/actions/artifact-clear
        continue-on-error: true
        with:
          user: fems
          password: ${{ secrets.MINIO_ACCESS_KEY }}
          name: |
            environment
            jars
            ui
