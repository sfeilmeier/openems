name: sonarqube-scan 
run-name: SonarQube Scan 
on:
  schedule:
    - cron: "0 5 * * *"

jobs:
  gradle-scan:
    runs-on: ubuntu-sonarqube
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Build+Test
        run: |
          ./gradlew clean build
          ./gradlew test jacocoTestReport jacocoAggregatedReport

      - name: Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_JAVA }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_JAVA }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          ./gradlew sonar \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName='OpenEMS Java' \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoAggregatedReport/jacocoAggregatedReport.xml \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.login=${{ env.SONAR_TOKEN }}

  ui-scan:
    runs-on: ubuntu-sonarqube
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          sparse-checkout: |
            tools/
            ui/
            .gitea/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
          
      - name: Build+Test    
        run: |
          cd ui
          npm ci --prefer-offline
          node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"
          export CHROME_BIN=/usr/bin/google-chrome-stable
          npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
          
      - name: Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_UI }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_UI }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=ui/src \
            -Dsonar.tests=ui/src \
            -Dsonar.test.inclusions=**/*.spec.ts \
            -Dsonar.typescript.lcov.reportPaths=ui/coverage/ngv/lcov.info \
            -Dsonar.projectName='OpenEMS UI' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}
