name: sonarqube-scan 
run-name: SonarQube Scan 
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CI_MAX_CONCURRENT_BUILDS: ${{ vars.CI_MAX_CONCURRENT_BUILDS }}

jobs:
  edge-scan:
    runs-on: ubuntu-sonarqube
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-edge-cache_gradle
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Jacoco Report
        run: |
          ./gradlew testEdge jacocoEdgeReport

      - name: Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_EDGE }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_EDGE }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          ./gradlew sonar \
            -Psonar.scope=edge \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName='OpenEMS Edge' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}

  backend-scan:
    runs-on: ubuntu-sonarqube
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          key: ${{ runner.os }}-backend-cache_gradle
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper

      - name: Jacoco Report
        run: |
          ./gradlew testBackend jacocoBackendReport

      - name: Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_BACKEND }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_BACKEND }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          ./gradlew sonar \
            -Psonar.scope=backend \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.projectName='OpenEMS Backend' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}

  ui-scan:
    runs-on: ubuntu-sonarqube
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            tools/
            ui/
            .gitea/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: NPM Install
        run: |
          cd ui
          npm ci --prefer-offline
          
      - name: Build+Test    
        run: |
          cd ui
          export CHROME_BIN=/usr/bin/google-chrome-stable
          npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI
          node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"
          
      - name: Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN_UI }}
          SONAR_PROJECT_KEY: ${{ vars.SONARQUBE_PROJECT_KEY_UI }}
          SONAR_HOST_URL: ${{ vars.SONARQUBE_HOST_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.sources=ui/src \
            -Dsonar.tests=ui/src \
            -Dsonar.test.inclusions=**/*.spec.ts \
            -Dsonar.typescript.lcov.reportPaths=ui/coverage/ngv/lcov.info \
            -Dsonar.projectName='OpenEMS UI' \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}
