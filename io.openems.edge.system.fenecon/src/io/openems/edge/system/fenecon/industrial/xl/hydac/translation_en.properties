gatewayError = System error gateway
systemError = System error controller (including E99)
alarmActive = Alarm present
warningActive = Warning present
overTemperatureAlarm = E11, E21, E31: Coolant | Temperature too high (alarm)
underTemperatureAlarm = E10, E20, E30: Coolant | Temperature too low (alarm)
flowAlarm = E01: Cooling medium | Flow rate (alarm KK1)
dryRun = E03: Dry running (fill level alarm)
conductanceWarning = U32: Coolant | Conductivity too high (warning)
overTemperatureWarning = U11, U21, U31, U35: Coolant | Temperature too high (warning)
underTemperatureWarning = U10, U20, U30, U34: Coolant | Temperature too low (warning)
flowWarning = U04: Coolant | Flow (warning)
waterLevelWarning = U01: Level (level warning)
housingOpened = E04: Housing not closed
filterSpoiled = U02, U03: Filter mat (clogged, not present)
lowPressureAlarm = U41: Refrigeration circuit error - high pressure
highPressureAlarm = U40: Refrigeration circuit error - low pressure
phaseError = E44: Phase sequence error (rotating field incorrect)
fanError = E53: Fan malfunction (speed-controlled)
miscellaneousWarning = U06, U07, U08, U09: Other warning (input E3, E4, E5, E6)
miscellaneousAlarm = E06, E07, E08, E09: Other alarm (input E3, E4, E5, E6)
motorProtectionSwitchPump = E02: Motor protection pump (or general)
motorProtectionSwitchCompressor = U42: Motor protection compressor (and fan)
sensorError = E80, E81, E82, E83, E90, E91, E92, E93: Sensor error
