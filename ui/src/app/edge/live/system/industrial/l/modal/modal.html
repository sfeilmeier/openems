<oe-modal title="FENECON Industrial L" [component]="component" [formGroup]="formGroup" *ngIf="isInitialized"
    helpKey="SYSTEM.INDUSTRIAL_L">

    <oe-modal-line [name]="'Edge.Index.Widgets.SYSTEM.OVERALL_SYSTEM' | translate"></oe-modal-line>
    <oe-modal-buttons [formGroup]="formGroup" controlName="startStop" [component]="component" [buttons]="[
    { name: 'START', value: 'START', icon: {color:'success', name: 'sunny'}},
    { name: 'STOP', value: 'STOP', icon: {color:'danger', name: 'power'}}]">
    </oe-modal-buttons>

    <oe-modal-info-line [info]="'Edge.Index.Widgets.SYSTEM.INDUSTRIAL.NOTE' | translate"
        style="font-size: small;"></oe-modal-info-line>

    <oe-modal-horizontal-line></oe-modal-horizontal-line>

    <table class="full_width">
        <tr>
            <td [style.width]="(leftColumnWidth ?? 65)  + '%'" *ngIf="edge.roleIsAtLeast(this.Role.INSTALLER)">
                {{'SYSTEM.INDUSTRIAL.BMS_HARD_RESET' | translate}}
            </td>
            <td [style.width]="(leftColumnWidth ?? 65)  + '%'" class="align_right">
                <ion-button slot="end" button (click)="reset()">
                    <ion-icon name="send-outline"></ion-icon>
                </ion-button>
            </td>
        </tr>
    </table>

</oe-modal>
