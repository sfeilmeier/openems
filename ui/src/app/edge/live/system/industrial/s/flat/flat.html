@if (isInitialized) {
  <oe-flat-widget [modalComponent]="modalComponent" [icon]="{name: 'square-outline'}" title="FENECON Industrial S">
    <oe-modal-line [name]="'GENERAL.STATE' | translate" [converter]="CONVERT_INDUSTRIAL_STATE"
      [channelAddress]="'system0/StateMachine'"></oe-modal-line>
    <oe-modal-horizontal-line></oe-modal-horizontal-line>
    <table class="full_width">
      <tr>
        <td [style.width]="(leftColumnWidth ?? 65)  + '%'">
          {{'SYSTEM.INDUSTRIAL.CLEAR_TIMEOUT' | translate}}
        </td>
        <td [style.width]="(leftColumnWidth ?? 65)  + '%'" class="align_right">
          <ion-button slot="end" button (click)="clear(); $event.stopPropagation();">
            <ion-icon name="send-outline"></ion-icon>
          </ion-button>
        </td>
      </tr>
    </table>
  </oe-flat-widget>
}
