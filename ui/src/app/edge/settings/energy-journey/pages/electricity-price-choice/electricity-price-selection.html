<header></header>
<ion-content>
  <ng-container *ngIf="formGroup">
    <ion-grid>
      <ion-row class="full_width ion-justify-content-center ion-padding-top">
        <ion-col sizeLg="6" sizeMd="10" sizeSm="12">
          <oe-flat-widget [formGroup]="formGroup" title="Energy Journey: Batterieerweiterung"
            [icon]="{name: 'analytics'}">
            <oe-flat-widget-line leftColumnWidth="100" name="Ihr System ist seit mehr als einem Jahr in Betrieb. Analysieren Sie hier, wie
            sich eine Batterieerweiterung ausgewirkt hätte.">
            </oe-flat-widget-line>
            <oe-flat-widget-line-divider></oe-flat-widget-line-divider>
            <oe-flat-widget-line style="font-weight: bolder;" leftColumnWidth="100" name="Bitte geben Sie Ihren aktuellen Strompreis an. Falls Sie bereits einen
            dynamischen Stromtarif nutzen, geben Sie bitte einen Mittelwert an.">
            </oe-flat-widget-line>

            <oe-flat-widget-line-divider></oe-flat-widget-line-divider>

            <form [formGroup]="formGroup">
              <ion-item class="ion-no-padding" lines="inset">
                <ion-label>Cent/kWh</ion-label>
                <ion-input [placeholder]="DEFAULT_ELECTRICITY_PRICE" type="number" formControlName="electricityPrice"
                  value="{{formGroup.controls['electricityPrice'].value}}" style="text-align: end;">
                </ion-input>
              </ion-item>
              <ion-item [disabled]="!formGroup.controls['electricityPrice'].dirty" class="ion-float-right" lines="none">
                <ion-button fill="outline" (click)="onNextClicked()">Analyse starten</ion-button>
              </ion-item>
            </form>
          </oe-flat-widget>
        </ion-col>
      </ion-row>
    </ion-grid>

  </ng-container>

</ion-content>
