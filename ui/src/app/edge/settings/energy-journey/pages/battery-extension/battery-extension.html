<header></header>
<ion-content>
  <ng-container>
    <ion-row class="full_width ion-justify-content-center ion-padding-top">
      <ion-col sizeLg="6" sizeMd="10" sizeSm="12">
        <oe-flat-widget title="Ihre Angaben" [icon]="{name: 'analytics', color:'primary'}">
          <oe-flat-widget-line name="Strompreis: " [value]="electricityPrice"
            [converter]="CONVERT_TO_PRICE"></oe-flat-widget-line>
          <ion-item slot="end" lines="none">
            <ion-button slot="end" fill="outline" target="_blank" [routerLink]="['./electricityPriceChoice']"
              [queryParams]="{electricityPrice: electricityPrice}">
              <ion-label>Bearbeiten</ion-label>
            </ion-button>
          </ion-item>
        </oe-flat-widget>
      </ion-col>
    </ion-row>
    <ion-row class="full_width ion-justify-content-center ion-padding-top">
      <ion-col sizeLg="6" sizeMd="10" sizeSm="12">
        <oe-flat-widget [title]="chartTitle">
          <gridBuyChart [fromDate]="fromDate" [toDate]="toDate" [xAxisScalingType]="XAxisType.NUMBER" [simulatedData]="simulatedData">
          </gridBuyChart>
        </oe-flat-widget>
      </ion-col>
    </ion-row>

    <ion-row class="full_width ion-justify-content-center">
      <ion-col sizeLg="11" sizeMd="12" sizeSm="12">
        <battery-extension-detail [simulatedData]="simulatedData"></battery-extension-detail>
      </ion-col>
    </ion-row>
  </ng-container>
</ion-content>
