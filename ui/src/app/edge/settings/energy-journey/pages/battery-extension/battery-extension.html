<ion-content>
  <ng-container>
    <ion-row class="full_width ion-justify-content-center ion-padding-top">
      <ion-col sizeLg="6" sizeMd="10" sizeSm="12">
        <oe-energy-journey-constants [simulatedData]="simulatedData" [electricityPrice]="electricityPrice"
          [description]="constantsDescription"></oe-energy-journey-constants>
      </ion-col>
    </ion-row>
    <ion-row class="full_width ion-justify-content-center ion-padding-top">
      <ion-col sizeLg="6" sizeMd="10" sizeSm="12">
        <oe-flat-widget [title]="chartTitle">
          <gridBuyChart customChartHeightPercentage="50" [fromDate]="fromDate" [toDate]="toDate" [xAxisScalingType]="XAxisType.NUMBER"
            [simulatedData]="simulatedData">
          </gridBuyChart>
        </oe-flat-widget>
      </ion-col>
    </ion-row>

    <ion-row class="full_width ion-justify-content-center">
      <ion-col sizeLg="11" sizeMd="12" sizeSm="12">
        <battery-extension-detail [simulatedData]="simulatedData"></battery-extension-detail>
      </ion-col>
    </ion-row>
  </ng-container>
</ion-content>
