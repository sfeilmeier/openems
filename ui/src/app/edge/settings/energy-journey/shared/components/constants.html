<ion-card>
  <ngx-spinner [name]="spinnerId"></ngx-spinner>
  @if (simulatedData?.simulationData?.length > 0) {
    <ion-item color="light" lines="full">
      <ion-icon name="analytics" slot="start" size="large" color="primary"></ion-icon>
      <ion-label slot="start">{{"SETTINGS.ENERGY_JOURNEY.CONSTANTS.TITLE"  | translate}}</ion-label>
    </ion-item>
    <ion-card-content>
      <ion-grid>
        @if (description) {
          <ion-row>
            <ion-text>
              {{description}}
            </ion-text>
          </ion-row>
        }
        <ion-row class="ion-no-padding  ion-text">
          <ion-col sizeXs="12" sizeSm="12" sizeLg="8" sizeMd="8">
            <ul style="list-style-type: none;">
              @for (data of displayData; track data) {
                <li>
                  <oe-energy-journey-constant-line [category]="data.name" [value]="data.value"
                    [converter]="data.converter" [editable]="data.editable">
                  </oe-energy-journey-constant-line>
                </li>
              }
            </ul>
          </ion-col>
          <ion-col sizeXs="12" sizeSm="12" sizeLg="4" sizeMd="4" class="ion-align-self-end ion-text-end">
            <oe-flat-button
              [link]="{routeRelative: route, text: './electricityPriceChoice', queryParams: {electricityPrice: electricityPrice}}"
              color="primary">
              <span translate>SETTINGS.ENERGY_JOURNEY.CONSTANTS.EDIT</span>
            </oe-flat-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  }
</ion-card>
