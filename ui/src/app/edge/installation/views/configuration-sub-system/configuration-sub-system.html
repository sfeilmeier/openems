<installation-view iconName="settings-outline" header="{{'INSTALLATION.CONFIGURATION_SYSTEM.TITLE'|translate}}"
    (previousClicked)="onPreviousClicked()" (nextClicked)="onNextClicked()">

    <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>

    <ng-container *ngIf="form.controls.subType?.value">
        <ion-item lines="none">
            <ion-button (click)="openManual()">
                <ion-label>{{ 'INSTALLATION.CONFIGURATION_SYSTEM.OPEN_INSTRUCTIONS' | translate}}</ion-label>
                <ion-icon name="open-outline" slot="start"></ion-icon>
            </ion-button>
        </ion-item>
    </ng-container>

</installation-view>
