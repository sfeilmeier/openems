@for (step of steps; track step; let i = $index; let last = $last) {
  <ion-item [lines]="last ? 'none': 'full'">
    <ion-label class="ion-text-wrap">
      <h3><b>{{(i + 1) + ". " + step.header}}:</b></h3>
      <p>
        <ion-text style="color: var(--ion-color-text)" [innerHTML]="step.description">
        </ion-text>
        @for (child of step.children; track child) {
          <ion-item [lines]="lastChild ? 'none': 'full'">
            <ion-label class="ion-text-wrap">
              <h3><b>{{child.header}}</b></h3>
              <p [innerHTML]="child.description">
              </p>
            </ion-label>
          </ion-item>
        }
      </p>
    </ion-label>
  </ion-item>
}
