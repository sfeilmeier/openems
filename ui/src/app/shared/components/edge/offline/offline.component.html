<ion-card>
    <ion-item lines="full" color="light">
        <ion-icon slot="start" size="large" color="danger" name="cloud-offline-outline"></ion-icon>
        <ion-label [translateParams]="{edgeShortName: environment.edgeShortName}" translate>OFFLINE.GENERAL.EMS_OFFLINE
            <p>
                <a href="https://fenecon.de/faq/#fems" target="_blank" translate>OFFLINE.GENERAL.MORE_INFO</a>
            </p>
        </ion-label>
    </ion-item>

    <ng-container>
        <ion-card-content>
            <ion-grid class="full_width ion-padding">
                <div style="background-color: var(--ion-color-light);">
                    <ion-row class="ion-text-center" *ngIf="isAtLeastInstaller && timeSinceOffline !== null">
                        <ion-col
                            [innerHTML]="'OFFLINE.GENERAL.TIME_OUT' | translate:{ timeSinceOffline: timeSinceOffline }">
                        </ion-col>
                    </ion-row>
                    <ion-row class="ion-text-center">
                        <ion-col size="12" class="ion-font-weight-bolder ion-font-size-medium" translate>
                            OFFLINE.GENERAL.TRY
                        </ion-col>
                        <ion-col size="12">
                            <ion-label class="ion-text-wrap" [innerHTML]="'OFFLINE.GENERAL.AVAILABILITY' | translate">
                            </ion-label>
                        </ion-col>
                    </ion-row>
                </div>
            </ion-grid>
        </ion-card-content>
    </ng-container>

    <ion-card-content>
        <ion-card>
            <ion-accordion-group>
                <ion-accordion value=" first">
                    <ion-item slot="header" color="light">
                        <ion-label class="ion-text-wrap ion-font-size-medium"
                            [innerHTML]="'OFFLINE.GENERAL.SUB_HEADER' | translate">
                        </ion-label>
                    </ion-item>
                    <div class="ion-padding" slot="content" *ngIf="edge">
                        <ion-list class="ion-text-center">
                            <ng-container [ngSwitch]="edge?.producttype">
                                <oe-manual-home-10 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME"></oe-manual-home-10>
                                <oe-manual-home-20-30 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME_6"></oe-manual-home-20-30>
                                <oe-manual-home-20-30 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME_10"></oe-manual-home-20-30>
                                <oe-manual-home-20-30 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME_15"></oe-manual-home-20-30>
                                <oe-manual-home-20-30 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME_20"></oe-manual-home-20-30>
                                <oe-manual-home-20-30 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME_30"></oe-manual-home-20-30>
                                <oe-manual-home-20-30 [role]="edge?.role"
                                    *ngSwitchCase="Producttype.HOME_20_30"></oe-manual-home-20-30>
                                <oe-manual-default [role]="edge?.role" *ngSwitchDefault></oe-manual-default>
                            </ng-container>
                        </ion-list>
                    </div>
                </ion-accordion>
            </ion-accordion-group>
        </ion-card>
    </ion-card-content>
</ion-card>
